spring:
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    # Varios nodos del clúster, separados por coma (host1:5672,host2:5672). Si se define, reemplaza a host/port
    # y el cliente se reconecta solo al siguiente nodo cuando uno cae.
    addresses: ${RABBITMQ_ADDRESSES:}
    username: ${RABBITMQ_USER}
    password: ${RABBITMQ_PASS}
    listener:
      simple:
        # Ack manual: cada consumidor decide cuándo hacer ack / nack
        acknowledge-mode: manual
        # Un mensaje a la vez por consumidor (fair dispatch)
        prefetch: 1

# Puerto del endpoint interno de estado de las DLQ (bookings 8081, catalog 8082, report 8083)
server:
  port: ${SERVER_PORT:8084}

campuslab:
  # ---------------------------------------------------------------------------
  # Topología RabbitMQ: ÚNICO lugar donde se definen nombres de exchanges, colas
  # y routing keys. El código Java (config, consumidores, productor) los lee de
  # aquí; no hay nombres escritos a mano.
  #
  # IMPORTANTE: este bloque debe ser IDÉNTICO en ms-campuslab-bookings (que
  # también declara la topología). RabbitMQ rechaza redeclarar una cola con
  # argumentos distintos (PRECONDITION_FAILED).
  # ---------------------------------------------------------------------------
  messaging:
    exchanges:
      direct: cmd.direct
      topic: cmd.topic
      dead-letter: cmd.dead.dlx
    queues:
      email:
        name: q.cmd.email
        dlq: q.cmd.email.dlq
        direct-routing-key: email.send
        topic-routing-key: "email.*"
        dlq-routing-key: email.dlq
      prep:
        name: q.cmd.prep
        dlq: q.cmd.prep.dlq
        direct-routing-key: prep.ticket
        topic-routing-key: "prep.#"
        dlq-routing-key: prep.dlq
      voucher:
        name: q.cmd.voucher
        dlq: q.cmd.voucher.dlq
        direct-routing-key: voucher.gen
        topic-routing-key: "voucher.*"
        dlq-routing-key: voucher.dlq
    retention:
      queue-ttl-ms: 30000        # un comando que nadie consume en 30 s expira y va a la DLQ
      queue-max-length: 1000     # sobre 1000 mensajes, los más antiguos van a la DLQ
      dlq-ttl-ms: 86400000       # la DLQ conserva los fallidos 24 h para análisis
    idempotency:
      max-tracked-events: 10000  # eventId recordados por flujo para descartar duplicados
    # classic: cada cola vive en UN nodo del clúster. quorum: réplicas en varios nodos (tolera la caída de uno
    # solo con 3 o más nodos). Cambiarlo exige borrar antes las colas ya declaradas. Idéntico en notify y bookings.
    queue-type: ${RABBITMQ_QUEUE_TYPE:classic}

  notify:
    # Reintentos con backoff exponencial antes de mandar el mensaje a la DLQ
    retry:
      max-attempts: 3        # 3 intentos en total
      initial-interval: 1000 # 1 segundo
      multiplier: 2.0        # duplica la espera en cada intento
      max-interval: 10000    # 10 segundos máximo
    # Solo para demostrar reintentos/DLQ: probabilidad (0.0 a 1.0) de que un mensaje falle. 0 = apagado.
    simulated-failure-rate: ${NOTIFY_SIMULATED_FAILURE_RATE:0}
