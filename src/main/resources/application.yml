spring:
  application:
    name: ms-campuslab-notify
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASS:guest}
    listener:
      simple:
        acknowledge-mode: manual # Fundamental para hacer ACK/NACK explícitos
        retry:
          enabled: true
          max-attempts: 3