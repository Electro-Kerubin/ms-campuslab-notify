spring:
  rabbitmq:
    host: ${RABBITMQ_HOST}
    port: ${RABBITMQ_PORT}
    username: ${RABBITMQ_USER}
    password: ${RABBITMQ_PASS}
    listener:
      simple:
        # Ack manual: cada consumidor decide cuándo hacer ack / nack
        acknowledge-mode: manual
        # Un mensaje a la vez por consumidor (fair dispatch)
        prefetch: 1

# Puerto del endpoint interno de estado de las DLQ (bookings 8081, catalog 8082, report 8083)
server:
  port: ${SERVER_PORT:8084}

campuslab:
  # Nombres de la topología RabbitMQ (única fuente en el servicio, ver RabbitNamesProperties).
  # ms-campuslab-bookings tiene este mismo bloque: si se cambia un nombre, cambiarlo en los dos.
  rabbit:
    exchanges:
      direct: cmd.direct           # comandos con routing key exacta
      topic: cmd.topic             # comandos por patrón
      dead-letter: cmd.dead.dlx    # destino de los mensajes rechazados o expirados
    # Email/push al estudiante
    email:
      queue: q.cmd.email
      dead-letter-queue: q.cmd.email.dlq
      routing-key: email.send
      topic-pattern: "email.*"
      dead-letter-routing-key: email.dlq
    # Ticket de preparación de sala/equipo para el técnico
    prep:
      queue: q.cmd.prep
      dead-letter-queue: q.cmd.prep.dlq
      routing-key: prep.ticket
      topic-pattern: "prep.#"
      dead-letter-routing-key: prep.dlq
    # PDF de vale de retiro / acta de devolución
    voucher:
      queue: q.cmd.voucher
      dead-letter-queue: q.cmd.voucher.dlq
      routing-key: voucher.gen
      topic-pattern: "voucher.*"
      dead-letter-routing-key: voucher.dlq
  notify:
    # Reintentos con backoff exponencial antes de mandar el mensaje a la DLQ
    retry:
      max-attempts: 3        # 3 intentos en total
      initial-interval: 1000 # 1 segundo
      multiplier: 2.0        # duplica la espera en cada intento
      max-interval: 10000    # 10 segundos máximo
    # Solo para demostrar reintentos/DLQ: probabilidad (0.0 a 1.0) de que un mensaje falle. 0 = apagado.
    simulated-failure-rate: ${NOTIFY_SIMULATED_FAILURE_RATE:0}
