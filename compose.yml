services:
  rabbitmq:
    image: rabbitmq:4.0-management
    container_name: campuslab-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-guest}
      RABBITMQ_NODE_IP_ADDRESS: 0.0.0.0
      RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS: "-rabbit loopback_users []"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - campuslab-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  notify-svc:
    build: .
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8084:8084"   # endpoint interno de estado de las DLQ (lo consume el BFF)
    environment:
      RABBITMQ_HOST: ${RABBITMQ_HOST:-rabbitmq}
      RABBITMQ_PORT: ${RABBITMQ_PORT:-5672}
      RABBITMQ_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_PASS: ${RABBITMQ_PASS:-guest}
      # Solo para demo: probabilidad (0.0 a 1.0) de que un mensaje falle y termine en la DLQ
      NOTIFY_SIMULATED_FAILURE_RATE: ${NOTIFY_SIMULATED_FAILURE_RATE:-0}
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - campuslab-network

networks:
  campuslab-network:
    name: campuslab-network

volumes:
  rabbitmq_data:
