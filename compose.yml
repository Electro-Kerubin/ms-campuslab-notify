services:
  rabbitmq:
    image: rabbitmq:4.0-management
    profiles: ["local-dev"]
    container_name: campuslab-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-guest}
      RABBITMQ_NODE_IP_ADDRESS: 0.0.0.0
      RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS: "-rabbit loopback_users []"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - campuslab-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  notify-svc:
    build: .
    environment:
      RABBITMQ_ADDRESSES: ${RABBITMQ_ADDRESSES:-}
      RABBITMQ_HOST: ${RABBITMQ_HOST:-ec2-mq}
      RABBITMQ_PORT: ${RABBITMQ_PORT:-5672}
      RABBITMQ_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_PASS: ${RABBITMQ_PASS:-guest}
      RABBITMQ_VHOST: ${RABBITMQ_VHOST:-/}
      SMTP_HOST: ${SMTP_HOST:-localhost}
      SMTP_PORT: ${SMTP_PORT:-25}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_AUTH: ${SMTP_AUTH:-false}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
      MANAGEMENT_PORT: ${MANAGEMENT_PORT:-8081}
      NOTIFY_IDEMPOTENCY_TTL: ${NOTIFY_IDEMPOTENCY_TTL:-PT24H}
      VOUCHER_OUTPUT_DIR: ${VOUCHER_OUTPUT_DIR:-/tmp/notify-vouchers}
    ports:
      - "${NOTIFY_MANAGEMENT_PORT:-8081}:8081"
    networks:
      - campuslab-network

networks:
  campuslab-network:
    name: campuslab-network

volumes:
  rabbitmq_data:
